<div class="container">
  <h2>Restablecer contraseña</h2>
  <p>Ingresa tu email y te enviaremos un link para restablecer tu contraseña.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <div class="field">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="correo@ejemplo.com" />
      @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <span class="error">Email inválido</span>
      }
    </div>

    @if (successMsg()) {
      <p class="success">{{ successMsg() }}</p>
    }

    @if (errorMsg()) {
      <p class="error">{{ errorMsg() }}</p>
    }

    <button type="submit" [appLoadingButton]="loading()">
      {{ loading() ? 'Enviando...' : 'Enviar link' }}
    </button>

  </form>

  <p><a routerLink="/auth/login">Volver al login</a></p>
</div>
