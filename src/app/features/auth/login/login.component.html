<div class="container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Iniciar Sesión</h2>
    </div>
    <div class="auth-body">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="correo@ejemplo.com" />
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <span class="error">Email inválido</span>
          }
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" formControlName="password" placeholder="••••••••" />
          @if (form.get('password')?.invalid && form.get('password')?.touched) {
            <span class="error">Mínimo 6 caracteres</span>
          }
        </div>
        @if (errorMsg()) {
          <p class="error">{{ errorMsg() }}</p>
        }
        <button type="submit" [appLoadingButton]="loading()">
          {{ loading() ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
      <div class="auth-links">
        <a routerLink="/auth/forgot-password">¿Olvidaste tu contraseña?</a>
        <span>·</span>
        <a routerLink="/auth/register">Regístrate</a>
      </div>
    </div>
  </div>
</div>
